services:
  web:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - onprem-net

  php:
    image: php:8.1-fpm
    container_name: php
    volumes:
      - ./html:/var/www/html
    networks:
      - onprem-net

  dns:
    image: ubuntu/bind9:9.18-22.04_edge
    container_name: bind
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./dns/named.conf:/etc/bind/named.conf
      - ./dns/zones:/etc/bind/zones
    networks:
      - onprem-net

  mail:
    image: boky/postfix
    container_name: mail
    ports:
      - "587:587"
    environment:
      - HOSTNAME=mail.example.local
      - DOMAIN=example.local
      - RELAY_NETWORKS=172.20.0.0/16
      - MAILNAME=example.local
      - ALLOWED_SENDER_DOMAINS=example.local
    networks:
      - onprem-net

  dovecot:
    image: dovecot/dovecot:2.3.20
    container_name: dovecot
    ports:
      - "143:143"
    volumes:
      - /home/yosuke/web-server/mail/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf
      - maildata:/var/mail
    networks:
      - onprem-net
    depends_on:
      - mail

networks:
  onprem-net:
    driver: bridge

volumes:
  maildata:
